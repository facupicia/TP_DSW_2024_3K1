[build]
  command = "npm install && npm run build"
  publish = "dist/frontend/browser"

  [build.environment]
    NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.csr.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net data:; img-src 'self' data: blob: https:; connect-src 'self' https://backend-eventlife.onrender.com https://api.vidaeventofiesta.site http://localhost:3000 https://accounts.google.com; frame-src https://accounts.google.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'"
    Permissions-Policy = "camera=(self), geolocation=(self), microphone=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
