<nav class="fixed top-0 w-full z-50 bg-white/30 backdrop-blur-sm border-b border-gray-100 transition-all duration-300">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">
      
      <div class="flex-shrink-0 flex items-center">
        <a href="#" class="text-xl font-semibold tracking-tight text-gray-900 hover:opacity-70 transition-opacity">
          EventLife
        </a>
      </div>

      <div class="hidden md:flex items-center space-x-8">
        <ng-container *ngIf="isLoggedIn">
          <a href="/events" class="text-[13px] font-medium text-gray-600 hover:text-black transition-colors">Eventos</a>
          <a (click)="crearEvento()" class="text-[13px] font-medium text-gray-600 hover:text-black cursor-pointer transition-colors">Crear Evento</a>
        </ng-container>

        <ng-container *ngIf="!isLoggedIn">
          <button (click)="redirectToLogin()" class="text-[13px] font-medium text-gray-900 hover:text-blue-600 transition-colors">
            Iniciar sesión
          </button>
          <button (click)="redirectToRegister()" class="bg-black text-white text-[13px] font-medium px-4 py-1.5 rounded-full hover:bg-gray-800 transition-transform active:scale-95">
            Registrarse
          </button>
        </ng-container>

        <ng-container *ngIf="isLoggedIn">
          <img [src]="user?.imgPerfil || 'https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_960_720.png'"
            class="h-8 w-8 rounded-full object-cover cursor-pointer border border-gray-200 hover:ring-2 hover:ring-gray-200 transition-all"
            (click)="redirectToProfile()">
        </ng-container>
      </div>

      <div class="flex items-center md:hidden">
        <button type="button" class="text-gray-500 hover:text-gray-900 focus:outline-none">
          <span class="sr-only">Open main menu</span>
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
      </div>
    </div>
  </div>
</nav>
