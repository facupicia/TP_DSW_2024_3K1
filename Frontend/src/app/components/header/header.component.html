<nav
  class="fixed w-full z-50 bg-white/70 backdrop-blur-md border-b border-gray-100 transition-all duration-300 supports-[backdrop-filter]:bg-white/50"
  [style.top]="topOffset">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">

      <div class="flex-shrink-0 flex items-center z-[1002]">
        <a routerLink="/" class="text-xl font-bold tracking-tighter text-gray-900 cursor-pointer">
          EventLife<span class="text-blue-600">.</span>
        </a>
      </div>

      <div class="hidden md:flex items-center space-x-8">
        <ng-container *ngIf="user$ | async as user">
          <button (click)="router.navigate(['/events'])"
            class="text-sm font-medium text-gray-600 hover:text-black transition-colors">Explorar</button>
          <button (click)="crearEvento()"
            class="text-sm font-medium text-gray-600 hover:text-black transition-colors">Crear Evento</button>
        </ng-container>

        <ng-container *ngIf="(user$ | async) === null">
          <button routerLink="/login"
            class="text-sm font-medium text-gray-900 hover:text-blue-600 transition-colors">Iniciar sesión</button>
          <button routerLink="/register"
            class="bg-black text-white text-sm font-medium px-5 py-2 rounded-full hover:bg-gray-800 transition-transform active:scale-95">Registrarse</button>
        </ng-container>

        <ng-container *ngIf="user$ | async as user">
          <img
            [src]="user?.imgPerfil || 'https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_960_720.png'"
            class="h-9 w-9 rounded-full object-cover cursor-pointer border-2 border-transparent hover:border-gray-200 transition-all"
            (click)="redirectToProfile()">
        </ng-container>
      </div>

      <div class="flex items-center md:hidden z-[1002]">
        <button type="button" (click)="toggleMenu()"
          class="text-gray-900 p-2 rounded-full hover:bg-gray-100 focus:outline-none transition-colors">
          <span class="sr-only">Abrir menú</span>
          <div class="w-6 h-5 relative flex flex-col justify-between overflow-hidden">
            <span class="w-full h-0.5 bg-black transition-all duration-300" [class.rotate-45]="isMenuOpen"
              [class.translate-y-2]="isMenuOpen"></span>
            <span class="w-full h-0.5 bg-black transition-all duration-300" [class.opacity-0]="isMenuOpen"
              [class.translate-x-full]="isMenuOpen"></span>
            <span class="w-full h-0.5 bg-black transition-all duration-300" [class.-rotate-45]="isMenuOpen"
              [class.-translate-y-2.5]="isMenuOpen"></span>
          </div>
        </button>
      </div>
    </div>
  </div>
</nav>

<div class="md:hidden fixed inset-0 z-[1000]" [class.pointer-events-none]="!isMenuOpen" [style.top]="topOffset">

  <div class="absolute inset-0 bg-black/20 backdrop-blur-[2px] transition-opacity duration-300"
    [class.opacity-0]="!isMenuOpen" (click)="toggleMenu()"></div>

  <div
    class="absolute top-0 right-0 w-[85%] max-w-[300px] h-full bg-white/90 backdrop-blur-xl border-l border-white/20 shadow-2xl transform transition-transform duration-300 ease-out flex flex-col pt-24 px-6"
    [class.translate-x-full]="!isMenuOpen">

    <div *ngIf="user$ | async as user" class="mb-8 flex flex-col items-center text-center animate-fade-in-up">
      <img
        [src]="user.imgPerfil || 'https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_960_720.png'"
        class="w-20 h-20 rounded-full object-cover border-4 border-white shadow-md mb-3">
      <h3 class="font-bold text-lg text-gray-900">{{ user.firstname }} {{ user.lastname }}</h3>
      <p class="text-sm text-gray-500">{{ user.email }}</p>
    </div>

    <nav class="flex flex-col gap-2 w-full">
      <ng-container *ngIf="user$ | async as user; else guestLinks">
        <button (click)="navigateMobile('/events')"
          class="flex items-center w-full text-left p-4 rounded-xl text-gray-700 font-medium hover:bg-gray-100/80 active:scale-[0.98] transition-all">
          <svg class="w-5 h-5 mr-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
          Explorar Eventos
        </button>

        <button (click)="crearEvento()"
          class="flex items-center w-full text-left p-4 rounded-xl text-gray-700 font-medium hover:bg-gray-100/80 active:scale-[0.98] transition-all">
          <svg class="w-5 h-5 mr-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
          </svg>
          Crear Evento
        </button>

        <button *ngIf="user.rol === 'scanner' || user.rol === 'admin'" (click)="navigateMobile('/scanner')"
          class="flex items-center w-full text-left p-4 rounded-xl text-gray-700 font-medium hover:bg-gray-100/80 active:scale-[0.98] transition-all">
          <svg class="w-5 h-5 mr-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z">
            </path>
          </svg>
          Escanear
        </button>

        <button (click)="navigateMobile('/profile')"
          class="flex items-center w-full text-left p-4 rounded-xl text-gray-700 font-medium hover:bg-gray-100/80 active:scale-[0.98] transition-all">
          <svg class="w-5 h-5 mr-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
          </svg>
          Mi Perfil
        </button>

        <div class="h-px bg-gray-200 my-2 w-full"></div>

        <button (click)="redirectToLogout()"
          class="flex items-center w-full text-left p-4 rounded-xl text-red-600 font-bold hover:bg-red-50 active:scale-[0.98] transition-all">
          <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
          </svg>
          Cerrar Sesión
        </button>
      </ng-container>

      <ng-template #guestLinks>
        <div class="space-y-3 mt-4">
          <button (click)="navigateMobile('/login')"
            class="w-full py-3.5 px-4 bg-gray-100 text-gray-900 rounded-xl font-bold hover:bg-gray-200 transition-colors">
            Iniciar Sesión
          </button>
          <button (click)="navigateMobile('/register')"
            class="w-full py-3.5 px-4 bg-black text-white rounded-xl font-bold hover:bg-gray-800 transition-transform active:scale-[0.98]">
            Registrarse
          </button>
        </div>
      </ng-template>
    </nav>
  </div>
</div>
