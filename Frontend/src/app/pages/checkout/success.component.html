<section class="min-h-screen flex items-center justify-center bg-white">
  <div class="max-w-md w-full p-8 text-center">
    <div class="mx-auto w-16 h-16 rounded-full bg-green-100 flex items-center justify-center mb-4">
      <svg class="w-8 h-8 text-green-600" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    </div>
    <h1 class="text-2xl font-bold text-gray-900 mb-2">Pago aprobado</h1>

    <div *ngIf="loading" class="space-y-4">
      <p class="text-gray-600">Estamos confirmando tu pago con el banco...</p>
      <div class="flex items-center justify-center">
        <svg class="animate-spin h-6 w-6 text-gray-700" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor"
                d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
        </svg>
      </div>
    </div>

    <div *ngIf="confirmed" class="mt-4 transition-opacity duration-300 ease-in-out opacity-100">
      <p class="text-gray-700 mb-4">¡Pago confirmado! Aquí están tus tickets</p>
      <div class="grid gap-3">
        <div *ngFor="let t of lastTickets" class="p-4 border rounded-xl text-left">
          <div class="font-semibold">{{ t.titleEvent }}</div>
          <div class="text-sm text-gray-600">ID: {{ t.id }}</div>
        </div>
      </div>
      <a (click)="verTickets()" class="inline-block mt-6 px-5 py-3 rounded-xl bg-black text-white font-semibold">Ver mis tickets</a>
    </div>
  </div>
</section>
