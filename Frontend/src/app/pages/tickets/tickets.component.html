<main class="min-h-screen relative overflow-hidden bg-slate-100 pb-24 select-none">

  <!-- Fondo glass animado -->
  <div class="xmb-light-container">
    <div class="smoke-wave wave-blue"></div>
    <div class="smoke-wave wave-cyan"></div>
  </div>

  <!-- Header -->
  <div class="relative z-50">
    <app-header></app-header>
  </div>

  <div class="pt-28 px-4 sm:px-6 max-w-5xl mx-auto relative z-10">

    <!-- Título -->
    <div class="mb-10 text-center animate-fade-in-up">
      <h1 class="text-4xl sm:text-5xl font-black tracking-tight
               bg-clip-text text-transparent
               bg-gradient-to-r from-blue-600 to-cyan-500">
        Mis tickets
      </h1>
      <p class="text-slate-500 mt-2 text-sm sm:text-base">
        Tus entradas y experiencias digitales
      </p>
    </div>

    <!-- Buscador (mobile first) -->
    <div *ngIf="!loading && hasTickets" class="mb-8 animate-fade-in-up">
      <div class="relative rounded-2xl bg-white/60 backdrop-blur-xl
               border border-white/40 shadow-lg">

        <input [(ngModel)]="searchTerm" (ngModelChange)="aplicarFiltroOrden()" type="text"
          placeholder="Buscar tickets..." class="w-full pl-12 pr-4 py-4 rounded-2xl
                 bg-transparent text-slate-900 placeholder-slate-400
                 focus:outline-none focus:ring-2 focus:ring-blue-500/40" />

        <svg class="w-5 h-5 text-slate-400 absolute left-4 top-1/2 -translate-y-1/2">
          <path stroke="currentColor" stroke-width="2" fill="none" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      </div>
    </div>

    <!-- Loading -->
    <div *ngIf="loading" class="space-y-4 animate-pulse">
      <div class="h-24 rounded-3xl bg-white/60 backdrop-blur border"></div>
      <div class="h-24 rounded-3xl bg-white/60 backdrop-blur border"></div>
    </div>

    <!-- LISTA -->
    <div *ngIf="!loading && hasTickets" class="space-y-4">

      <div *ngFor="let group of filteredGroups; trackBy: trackGroup">

        <!-- CARD HEADER -->
        <div (click)="toggleGroup(group.eventId)" class="relative rounded-3xl overflow-hidden cursor-pointer
                 bg-white/60 backdrop-blur-xl
                 border border-white/40
                 shadow-lg transition-all active:scale-[0.98]" [class.shadow-blue-200]="isExpanded(group.eventId)">

          <!-- Indicador -->
          <div class="absolute left-0 top-0 bottom-0 w-1 bg-blue-500 transition-opacity"
            [style.opacity]="isExpanded(group.eventId) ? '1' : '0'">
          </div>

          <div class="flex items-center gap-4 p-4">

            <!-- Imagen -->
            <div class="w-14 h-14 rounded-2xl overflow-hidden shrink-0 bg-slate-200">
              <img [src]="group.eventImage" class="w-full h-full object-cover" />
            </div>

            <!-- Info -->
            <div class="flex-1 min-w-0">
              <h2 class="font-bold text-slate-900 truncate" [class.text-blue-600]="isExpanded(group.eventId)">
                {{ group.eventTitle }}
              </h2>

              <p class="text-sm text-slate-500 mt-1">
                {{ group.eventDate | date:'mediumDate' }} ·
                <span class="font-medium text-slate-700">
                  {{ group.tickets.length }} entrada{{ group.tickets.length > 1 ? 's' : '' }}
                </span>
              </p>
            </div>

            <!-- Chevron grande (mobile friendly) -->
            <div class="w-10 h-10 rounded-full flex items-center justify-center
                     bg-white/70 border border-white/50 transition-transform"
              [class.rotate-180]="isExpanded(group.eventId)">
              <svg class="w-5 h-5 text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
              </svg>
            </div>

          </div>
        </div>

        <!-- CONTENIDO -->
        <div class="grid transition-[grid-template-rows,opacity] duration-500 ease-out" [ngClass]="isExpanded(group.eventId)
    ? 'grid-rows-[1fr] opacity-100'
    : 'grid-rows-[0fr] opacity-0'">
          <div class="overflow-hidden">
            <div class="pt-5 grid grid-cols-1 sm:grid-cols-2 gap-6 justify-items-center">
              <app-ticket-card *ngFor="let ticket of group.tickets; trackBy: trackTicket" [ticket]="ticket"
                [group]="group">
              </app-ticket-card>
            </div>
          </div>
        </div>


      </div>

    </div>

    <!-- Vacío -->
    <div *ngIf="!loading && !hasTickets" class="text-center py-24 animate-fade-in-up">
      <div
        class="w-24 h-24 mx-auto rounded-full bg-white/60 backdrop-blur border flex items-center justify-center mb-6">
        <svg class="w-10 h-10 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-width="1.5" d="M20 12H4" />
        </svg>
      </div>
      <h3 class="text-xl font-bold text-slate-800">Sin tickets aún</h3>
      <p class="text-slate-500 mt-2 mb-6">Explorá eventos y empezá tu colección</p>
      <button (click)="irAEventos()"
        class="px-8 py-3 rounded-full bg-blue-600 text-white font-semibold shadow-lg active:scale-95">
        Explorar eventos
      </button>
    </div>

  </div>
</main>
