<main class="min-h-screen bg-gray-50/50 relative overflow-hidden pb-20">

  <div class="relative z-50">
    <app-header></app-header>
  </div>

  <div class="xmb-light-container">
    <div class="smoke-wave wave-blue"></div>
    <div class="smoke-wave wave-purple"></div>
    <div class="smoke-wave wave-cyan"></div>
  </div>

  <div class="pt-28 px-4 sm:px-6 lg:px-8 max-w-4xl mx-auto relative z-10">

    <div class="mb-8 animate-fade-in-up">
      <h1 class="text-3xl md:text-4xl font-bold text-gray-900 tracking-tight mb-2">Mi Billetera</h1>
      <p class="text-gray-500">Tus accesos para próximas experiencias.</p>
    </div>

    <div *ngIf="!loading && hasTickets" class="mb-8 animate-fade-in-up">
      <div class="relative">
        <input [(ngModel)]="searchTerm" (ngModelChange)="aplicarFiltroOrden()" type="text"
          placeholder="Buscar evento..."
          class="w-full pl-10 pr-4 py-3 rounded-xl border-0 bg-white shadow-sm ring-1 ring-gray-200 focus:ring-2 focus:ring-blue-500 transition-all"
          aria-label="Buscar eventos">
        <svg class="w-5 h-5 text-gray-400 absolute left-3 top-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      </div>
    </div>

    <div *ngIf="loading" class="space-y-6 animate-pulse">
      <div class="h-40 bg-gray-200 rounded-3xl w-full"></div>
      <div class="h-40 bg-gray-200 rounded-3xl w-full"></div>
    </div>

    <div *ngIf="!loading && hasTickets" class="space-y-12">

      <div *ngFor="let group of filteredGroups; trackBy: trackGroup" class="animate-fade-in-up">

        <div (click)="toggleGroup(group.eventId)" 
             class="flex items-center gap-4 mb-4 cursor-pointer group select-none">
          <div class="w-14 h-14 rounded-2xl overflow-hidden shadow-sm border border-white shrink-0">
            <img [src]="group.eventImage" class="w-full h-full object-cover">
          </div>
          <div class="flex-1 min-w-0">
            <h2 class="text-xl font-bold text-gray-900 leading-tight truncate">{{ group.eventTitle }}</h2>
            <p class="text-sm text-gray-500 truncate">{{ group.eventDate | date:'mediumDate' }} • {{ group.eventLocation }}</p>
          </div>
          <button class="w-8 h-8 flex items-center justify-center rounded-full bg-white border border-gray-200 text-gray-400 group-hover:text-blue-600 transition-colors">
            <svg class="w-5 h-5 transition-transform duration-300" [class.rotate-180]="!collapsed.has(group.eventId)" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
          </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6" *ngIf="!collapsed.has(group.eventId)">

          <div *ngFor="let ticket of group.tickets; trackBy: trackTicket"
            class="ticket-card relative bg-white rounded-[24px] shadow-xl shadow-gray-200/50 overflow-hidden flex flex-col sm:flex-row group transition-all duration-300">
            
            <div class="absolute inset-0 bg-gradient-to-br from-white via-white to-gray-50 z-0"></div>
            
            <div class="relative z-10 flex-1 p-6 flex flex-col justify-between">
              
              <div>
                <div class="flex justify-between items-start mb-4">
                  <span class="px-2.5 py-1 bg-black text-white text-[10px] font-bold uppercase tracking-widest rounded-lg">
                    General
                  </span>
                  <div class="flex items-center gap-1.5" 
                       [class.text-green-600]="ticket.status === 'valid'"
                       [class.text-gray-400]="ticket.status !== 'valid'">
                    <span class="w-2 h-2 rounded-full" [class.bg-green-500]="ticket.status === 'valid'" [class.bg-gray-400]="ticket.status !== 'valid'"></span>
                    <span class="text-[10px] font-bold uppercase">{{ ticket.status === 'valid' ? 'Activo' : 'Usado' }}</span>
                  </div>
                </div>

                <div class="space-y-1">
                  <p class="text-xs text-gray-400 font-bold uppercase tracking-wider">Asistente</p>
                  <p class="font-bold text-gray-900 text-xl truncate">Tú</p>
                </div>
              </div>

              <div class="mt-6 flex items-center gap-2 pt-4 border-t border-gray-100">
                
                <button (click)="compartirTicket(ticket, group)" 
                        class="h-10 w-10 flex items-center justify-center rounded-xl bg-blue-50 text-blue-600 hover:bg-blue-100 transition-colors"
                        title="Compartir Ticket">
                  <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />
                  </svg>
                </button>

              </div>
            </div>

            <div class="relative w-full h-0 border-t-2 border-dashed border-gray-200 sm:w-0 sm:h-auto sm:border-t-0 sm:border-l-2">
              <div class="absolute -left-3 -top-3 w-6 h-6 bg-[#f9fafb] rounded-full sm:top-[-12px] sm:left-[-12px]"></div>
              <div class="absolute -right-3 -top-3 w-6 h-6 bg-[#f9fafb] rounded-full sm:bottom-[-12px] sm:left-[-12px] sm:top-auto sm:right-auto"></div>
            </div>

            <div class="relative z-10 p-6 flex flex-col items-center justify-center bg-gray-50/50 sm:w-40 shrink-0">
              <div class="bg-white p-2 rounded-xl shadow-sm border border-gray-100">
                <img [src]="ticket.qrCode" class="w-32 h-32 sm:w-24 sm:h-24 object-contain mix-blend-multiply">
              </div>
              <p class="text-[10px] text-gray-400 font-mono mt-3 text-center tracking-widest">
                {{ ticket.codigo_unico | slice:0:8 }}...
              </p>
            </div>

          </div>

        </div>
      </div>

    </div>

    <div *ngIf="!loading && !hasTickets" class="text-center py-20 animate-fade-in-up">
      <div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-6 text-gray-400">
        <svg class="w-10 h-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z" />
        </svg>
      </div>
      <h3 class="text-lg font-bold text-gray-900 mb-2">Tu billetera está vacía</h3>
      <button (click)="irAEventos()" class="mt-4 px-6 py-2.5 bg-black text-white rounded-full font-bold text-sm shadow-lg active:scale-95 transition-transform">
        Explorar Eventos
      </button>
    </div>

  </div>
</main>
