<main class="min-h-screen w-full bg-white relative overflow-x-hidden flex flex-col py-24">

    <div class="relative z-50">
        <app-header></app-header>
    </div>

    <div class="xmb-light-container">
        <div class="smoke-wave wave-blue"></div>
        <div class="smoke-wave wave-purple"></div>
        <div class="smoke-wave wave-cyan"></div>
    </div>

    <div class="flex-1 flex items-center justify-center relative z-10 px-4 pb-8">

        <div
            class="bg-gray-100/90 backdrop-blur-2xl rounded-[32px] shadow-2xl shadow-gray-200/50 border border-gray-100 p-8 w-full max-w-5xl animate-fade-in-up">

            <div class="flex justify-between items-center mb-6 border-b border-gray-100 pb-4">
                <div>
                    <h2 class="text-2xl font-bold text-gray-900 tracking-tight">Editar Perfil</h2>
                    <p class="text-gray-500 text-sm">Actualiza tu información personal.</p>
                </div>
                <div class="flex gap-3">
                    <a routerLink="/settings"
                        class="px-4 py-2 rounded-lg text-gray-500 text-sm font-medium hover:bg-gray-100 transition-colors">
                        Cancelar
                    </a>
                    <button (click)="actualizarPerfil()"
                        class="px-6 py-2 rounded-lg bg-gray-900 text-white text-sm font-bold hover:bg-black transition-transform active:scale-95 shadow-lg shadow-gray-900/10">
                        Guardar
                    </button>
                </div>
            </div>

            <form [formGroup]="formEditarPerfil">

                <div class="flex flex-col md:flex-row gap-8">

                    <div
                        class="w-full md:w-1/3 flex flex-col items-center justify-center bg-gray-50/50 rounded-2xl p-6 border border-white/50">
                        <div class="relative group">
                            <div
                                class="w-40 h-40 rounded-full p-1 bg-gradient-to-tr from-blue-100 to-purple-100 shadow-inner">
                                <img [src]="formEditarPerfil.get('imgPerfil')?.value || 'https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_960_720.png'"
                                    alt="Preview"
                                    class="w-full h-full rounded-full object-cover border-4 border-white shadow-sm transition-transform duration-500 group-hover:scale-105">
                            </div>
                            <div
                                class="absolute bottom-1 right-1 bg-gray-900 text-white p-2 rounded-full shadow-lg border-2 border-white">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                                </svg>
                            </div>
                        </div>

                        <div class="mt-6 w-full">
                            <label
                                class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest text-center mb-2">URL
                                de Imagen</label>
                            <input type="text" formControlName="imgPerfil"
                                class="w-full text-center bg-gray-100 border border-gray-100 rounded-xl py-2 px-3 text-gray-600 text-xs focus:ring-2 focus:ring-blue-500/20 outline-none transition-all"
                                placeholder="https://...">
                        </div>
                    </div>

                    <div class="w-full md:w-2/3">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

                            <div class="space-y-1">
                                <label
                                    class="text-[10px] font-bold text-gray-500 uppercase tracking-wider ml-1">Nombre</label>
                                <input type="text" formControlName="firstname"
                                    class="w-full bg-gray-100 border-none rounded-xl py-3 px-4 text-gray-900 text-sm font-medium focus:ring-2 focus:ring-black/5 focus:bg-white outline-none transition-all">
                            </div>

                            <div class="space-y-1">
                                <label
                                    class="text-[10px] font-bold text-gray-500 uppercase tracking-wider ml-1">Apellido</label>
                                <input type="text" formControlName="lastname"
                                    class="w-full bg-gray-100 border-none rounded-xl py-3 px-4 text-gray-900 text-sm font-medium focus:ring-2 focus:ring-black/5 focus:bg-white outline-none transition-all">
                            </div>

                            <div class="space-y-1">
                                <label
                                    class="text-[10px] font-bold text-gray-500 uppercase tracking-wider ml-1">Teléfono</label>
                                <input type="number" formControlName="phone"
                                    class="w-full bg-gray-100 border-none rounded-xl py-3 px-4 text-gray-900 text-sm font-medium focus:ring-2 focus:ring-black/5 focus:bg-white outline-none transition-all">
                            </div>

                            <!-- Ciudad (with search) -->
                            <div class="space-y-1 relative">
                                <label
                                    class="text-[10px] font-bold text-gray-500 uppercase tracking-wider ml-1">Ciudad</label>
                                <input type="text" formControlName="ciudad" placeholder="Escribe tu ciudad..."
                                    (input)="onInputLocation($event)" (blur)="closeSuggestions()" autocomplete="off"
                                    class="w-full bg-gray-100 border-none rounded-xl py-3 px-4 text-gray-900 text-sm font-medium focus:ring-2 focus:ring-black/5 focus:bg-white outline-none transition-all">

                                <ul *ngIf="showSuggestions && locationSuggestions.length > 0"
                                    class="absolute z-50 w-full bg-white border border-gray-200 rounded-xl mt-1 shadow-xl max-h-48 overflow-y-auto">
                                    <li *ngFor="let item of locationSuggestions" (mousedown)="selectAddress(item)"
                                        class="px-3 py-2 hover:bg-blue-50 cursor-pointer text-xs text-gray-700 border-b border-gray-100 last:border-none">
                                        {{ item.display_name }}
                                    </li>
                                </ul>
                            </div>

                            <!-- País (readonly) -->
                            <div class="space-y-1">
                                <label
                                    class="text-[10px] font-bold text-gray-500 uppercase tracking-wider ml-1">País</label>
                                <input type="text" formControlName="pais" readonly
                                    class="w-full bg-gray-200 border-none rounded-xl py-3 px-4 text-gray-700 text-sm font-medium cursor-not-allowed focus:outline-none">
                            </div>

                            <!-- Provincia (readonly) -->
                            <div class="space-y-1">
                                <label
                                    class="text-[10px] font-bold text-gray-500 uppercase tracking-wider ml-1">Provincia</label>
                                <input type="text" formControlName="provincia" readonly
                                    class="w-full bg-gray-200 border-none rounded-xl py-3 px-4 text-gray-700 text-sm font-medium cursor-not-allowed focus:outline-none">
                            </div>

                            <!-- Dirección (editable) -->
                            <div class="space-y-1">
                                <label
                                    class="text-[10px] font-bold text-gray-500 uppercase tracking-wider ml-1">Dirección</label>
                                <input type="text" formControlName="address" placeholder="Calle y número"
                                    class="w-full bg-gray-100 border-none rounded-xl py-3 px-4 text-gray-900 text-sm font-medium focus:ring-2 focus:ring-black/5 focus:bg-white outline-none transition-all">
                            </div>

                            <div class="space-y-1 md:col-span-2">
                                <label class="text-[10px] font-bold text-gray-500 uppercase tracking-wider ml-1">Fecha
                                    de Nacimiento</label>
                                <input type="date" formControlName="birth"
                                    class="w-full bg-gray-100 border-none rounded-xl py-3 px-4 text-gray-900 text-sm font-medium focus:ring-2 focus:ring-black/5 focus:bg-white outline-none transition-all">
                            </div>
                        </div>
                    </div>

                </div>
            </form>

        </div>
    </div>
</main>
