    <path d="M84 84h172M84 132h118" stroke="#ffffff" stroke-width="18" stroke-linecap="round" opacity="0.86"/>
    <circle cx="258" cy="136" r="32" fill="#60a5fa" opacity="0.95"/>
  </g>
  <text x="600" y="570" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="800" fill="#ffffff">EventLife</text>
</svg>
