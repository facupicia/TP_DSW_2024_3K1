services:
  # ==========================================================================
  # Backend API
  # ==========================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eventlife-backend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Redis interno del compose
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - eventlife-net
    # Acceso al host para llegar a PostgreSQL en 192.168.1.89
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ==========================================================================
  # Redis (caché + BullMQ)
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: eventlife-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eventlife-net

networks:
  eventlife-net:
    driver: bridge

volumes:
  redis-data:
